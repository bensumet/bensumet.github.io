<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ben Viwatmanitsakul: design engineer and frontend architect. Design systems, AI interfaces, and the print work they grew from." />
    <title>Ben Viwatmanitsakul</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the remembered mode before the first paint, so the page never flashes the other one.
      (function () {
        var m;
        try {
          m = localStorage.getItem('edge.color-mode');
          // Carry over a choice saved under the earlier key (ink or paper).
          var old = localStorage.getItem('edge.mode');
          if (!m && old) { m = old === 'paper' ? 'light' : 'dark'; localStorage.setItem('edge.color-mode', m); localStorage.removeItem('edge.mode'); }
        } catch (e) {}
        if (m === 'system') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-edge-mode', m === 'light' ? 'light' : 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
