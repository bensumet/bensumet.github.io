 return '<div class="gh">'+chev(g,grp)+'<h3>'+esc(label)+'</h3>'+(g==='insured'&&insHint(grp.v)?'<span class="chip c-rel">'+insHint(grp.v)+'</span>':'')+(g==='due'&&grp.v==='overdue'?'<span class="chip c-err">'+n+'</span>':'<span class="cnt">'+cnt+'</span>')+'</div>';
}
function menu(f){
 var sel=S.sel[f.key]||[];
 var all=f.opts.reduce(function(s,o){return s+o.n;},0);
 return '<div class="menu'+(f.key==='insured'||f.key==='record'||f.key==='assignee'?' wide':'')+'" role="menu" aria-label="'+FLABEL[f.key]+'"><div class="lbl">'+(f.key==='record'?'Ref No (entityRef)':f.key==='type'&&S.sc==='A'?'Entity type':FLABEL[f.key])+'</div>'+
  (f.opts.length>5||f.key==='insured'||f.key==='record'||f.key==='assignee'?'<div style="padding:6px 12px"><input class="ms" data-q="1" type="search" placeholder="Search" aria-label="Search '+FLABEL[f.key]+'" value="'+esc(S.q)+'"></div>':'')+
  '<button class="mi'+(sel.length?'':' sel')+'" role="menuitemradio" aria-checked="'+(!sel.length)+'" data-all="'+f.key+'"><span class="ck">'+(sel.length?'':'✓')+'</span><span>All</span><span class="n">'+all+'</span></button>'+
  f.opts.filter(function(o){return !S.q||vlabel(f.key,o.v).toLowerCase().indexOf(S.q.toLowerCase())>-1;}).map(function(o){
   var on=sel.indexOf(o.v)>-1,e=ENT[o.v];
   return '<button class="mi'+(on?' sel':'')+'" role="menuitemcheckbox" aria-checked="'+on+'" data-toggle="'+f.key+'" data-v="'+esc(o.v)+'"><span class="ck">'+(on?'✓':'')+'</span><span>'+esc(vlabel(f.key,o.v))+
   (f.key==='record'&&e?'<small>'+e.t+' · '+esc(e.ins)+'</small>':'')+(f.key==='insured'&&insHint(o.v)?'<small>'+insHint(o.v)+'</small>':'')+'</span><span class="n">'+o.n+'</span></button>';
  }).join('')+'</div>';
}
function render(){
 var sc=SC[S.sc],fs=facets(),gb=groupBy(fs),list=filtered(),total=items().length;
 var anySel=Object.keys(S.sel).some(function(f){return S.sel[f]&&S.sel[f].length;});
 document.getElementById('note').textContent=sc.note+(S.ver==='2'?' Rows use layout 2: the same chip line as the current rows, with a type icon at the left.':'');
 document.getElementById('sv').innerHTML=[['1','Rows: current'],['2','Rows: version 2']].map(function(a){return '<button data-ver="'+a[0]+'" aria-pressed="'+(S.ver===a[0])+'">'+a[1]+'</button>';}).join('');
 document.getElementById('sw').innerHTML=Object.keys(SC).map(function(k){return '<button data-sc="'+k+'" aria-pressed="'+(k===S.sc)+'">'+esc(SC[k].label)+'</button>';}).join('');
 var pills=fs.map(function(f){
  var sel=S.sel[f.key]||[],open=S.open===f.key;
  var lab=FLABEL[f.key]+': '+(sel.length===1?vlabel(f.key,sel[0]):sel.length>1?sel.length+' selected':'All');
  return '<div class="pw"><button class="pill'+(sel.length?' on':'')+'" data-menu="'+f.key+'" aria-haspopup="menu" aria-expanded="'+open+'" title="'+esc(lab)+'"><span class="pl">'+esc(lab)+'</span>'+CHEV+'</button>'+(open?menu(f):'')+'</div>';
 }).join('');
 var gopen=S.open==='group';
 var gmenu=gopen?'<div class="menu wide" role="menu" aria-label="Group by">'+gb.ok.map(function(k){
   return '<button class="mi'+(k===gb.g?' sel':'')+'" role="menuitemradio" aria-checked="'+(k===gb.g)+'" data-group="'+k+'"><span class="ck">'+(k===gb.g?'✓':'')+'</span><span>'+(k==='none'?'None':FLABEL[k])+' <span class="h">· '+GHINT[k]+'</span></span></button>';
 }).join('')+'</div>':'';
 var bar='<div class="bar">'+pills+(fs.length?'<span class="sep"></span>':'')+
  '<div class="pw"><button class="pill'+(gb.g!=='none'?' on':'')+'" data-menu="group" aria-haspopup="menu" aria-expanded="'+gopen+'">Group by: '+(gb.g==='none'?'None':gb.g==='insured'?'Insured':FLABEL[gb.g])+CHEV+'</button>'+gmenu+'</div>'+
  '<button class="clear" data-clear="1"'+(anySel?'':' disabled')+'><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16l-6 7v6l-4 2v-8z M3 3l18 18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>Clear Filters</button></div>';
 var status='';
 if(anySel){
  var parts=Object.keys(S.sel).filter(function(f){return S.sel[f]&&S.sel[f].length;}).map(function(f){return FLABEL[f]+' is '+S.sel[f].map(function(v){return vlabel(f,v);}).join(' or ');});
  status='<div class="status"><span>Showing '+list.length+' of '+total+' · '+esc(parts.join(' · '))+'</span><span>'+(total-list.length)+' hidden</span></div>';
 }
 var body,grs=list.length?groups(list,gb.g):[],colBtn='';
 if(S.ver==='2'&&gb.g!=='none'&&grs.length>1){var allC=grs.every(function(x){return S.col[gb.g+':'+x.v];});colBtn='<button class="lnk" data-colall="1">'+(allC?'Expand all':'Collapse all')+'</button>';}
 if(!list.length)body='<div class="empty">No results match these filters. <a href="#" data-clear="1">Clear Filters</a></div>';
 else body=grs.map(function(grp){var closed=S.ver==='2'&&gb.g!=='none'&&S.col[gb.g+':'+grp.v];return (gb.g==='none'?'':head(gb.g,grp))+(closed?'':grp.items.map(function(it){return row(it,gb.g);}).join(''));}).join('');
 var recs={};items().forEach(function(i){if(i.ref&&fv(i,'record'))recs[i.ref]=1;});
 var count=total+' matches'+(S.sc==='B'?' across '+Object.keys(recs).length+' records':'')+' · '+(gb.g==='due'?'By due date':'By relevance');
 document.getElementById('card').innerHTML=
  '<div class="intent"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(45 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-45 12 12)"/></g><circle cx="12" cy="12" r="1.9" fill="currentColor"/></svg>'+
  '<div><div class="q">'+esc(sc.query)+'</div><div class="row2">Interpreted as '+sc.interp.map(function(c){return '<span class="chip c-info">'+esc(c)+'</span>';}).join('')+'</div></div><span class="steps">3/3 steps completed</span></div>'+
  '<div class="count">'+count+colBtn+'</div>'+bar+status+body;
}
function fitMenu(){var m=document.querySelector('.menu');if(!m||window.innerWidth<=640)return;m.style.left='';var r=m.getBoundingClientRect(),vw=document.documentElement.clientWidth,over=r.right-(vw-16);if(over>0){m.style.left=(Math.max(r.left-over,16)-r.left)+'px';}}
var _render=render;render=function(){_render();fitMenu();};
var tt;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(tt);tt=setTimeout(function(){t.hidden=true;},3200);}
function keep(sel){render();var el=sel&&document.querySelector(sel);if(el)el.focus();}
document.addEventListener('click',function(e){
 var gh=e.target.closest('.gh');
 if(gh&&!e.target.closest('a,button')&&!String(window.getSelection&&window.getSelection())){var tg=gh.querySelector('[data-col]');if(tg){tg.click();return;}}
 var t=e.target.closest('[data-sc],[data-ver],[data-col],[data-colall],[data-menu],[data-all],[data-toggle],[data-group],[data-clear],[data-open],[data-task]');
 if(!t){if(e.target.closest('.menu'))return;if(S.open){S.open=null;S.q='';render();}return;}
 if(t.dataset.col){var ck=t.dataset.col;S.col[ck]=!S.col[ck];render();var cb=document.querySelector('[data-col="'+ck.replace(/"/g,'\\"')+'"]');if(cb)cb.focus();return;}
 if(t.dataset.colall){var gbn=groupBy(facets()).g,gs=groups(filtered(),gbn),allClosed=gs.every(function(x){return S.col[gbn+':'+x.v];});S.col={};if(!allClosed)gs.forEach(function(x){S.col[gbn+':'+x.v]=true;});render();return;}
 if(t.dataset.ver){S.ver=t.dataset.ver;render();return;}
 if(t.dataset.sc){S.sc=t.dataset.sc;S.sel={};S.grp=null;S.open=null;S.q='';S.col={};render();return;}
 if(t.dataset.menu){var k=t.dataset.menu;S.open=S.open===k?null:k;S.q='';keep('[data-menu="'+k+'"]');return;}
 if(t.dataset.all){S.sel[t.dataset.all]=[];S.col={};render();var al=document.querySelector('[data-all="'+t.dataset.all+'"]');if(al)al.focus();return;}
 if(t.dataset.toggle){var f=t.dataset.toggle,v=t.dataset.v,a=(S.sel[f]||[]).slice(),i=a.indexOf(v);
  if(i>-1)a.splice(i,1);else a.push(v);S.sel[f]=a;S.col={};
  render();var el=document.querySelector('[data-toggle="'+f+'"][data-v="'+v.replace(/"/g,'\\"')+'"]');if(el)el.focus();return;}
 if(t.dataset.group){S.grp=t.dataset.group;S.col={};S.open=null;keep('[data-menu="group"]');return;}
 if(t.dataset.clear){e.preventDefault();S.sel={};S.col={};S.open=null;render();return;}
 if(t.dataset.open){e.preventDefault();var kind=t.dataset.open;
  toast(kind==='note'||kind==='email'?'Opens '+t.dataset.ref+' with this '+kind+' open in the drawer, in edit mode':kind==='billing'||kind==='claim'?'Opens the '+kind+' placeholder page. There is no '+kind+' record page yet; it will open like a policy once there is.':'Opens '+(kind==='record'?'':kind+' ')+t.dataset.ref);return;}
 if(t.dataset.task){e.preventDefault();toast('Opens the Tasks screen with this task open in the drawer, in edit mode');return;}
});
document.addEventListener('input',function(e){var i=e.target.closest&&e.target.closest('[data-q]');if(!i)return;S.q=i.value;var pos=i.selectionStart;render();var n=document.querySelector('[data-q]');if(n){n.focus();n.setSelectionRange(pos,pos);}});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&S.open){var k=S.open;S.open=null;keep('[data-menu="'+k+'"]');}
});
render();
})();
</script>
