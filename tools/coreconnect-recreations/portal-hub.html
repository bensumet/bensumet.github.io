<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Portal Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1568px;height:668px;overflow:hidden}
body{font-family:-apple-system,"Segoe UI",Roboto,"Open Sans",Helvetica,Arial,sans-serif;color:#fff;position:relative;
 background:linear-gradient(115deg,#123447 0%,#0f2e44 35%,#06243c 60%,#03213a 100%)}
.bg{position:absolute;inset:0;overflow:hidden;background:linear-gradient(160deg,#0d2238 0%,#0b2a3c 55%,#0e3540 100%)}
.glow{position:absolute;left:50%;top:44%;width:900px;height:620px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(64,150,160,.28),rgba(64,150,160,0))}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px}
/* soft vertical ribbing to echo original texture mood */
.rib{position:absolute;left:0;top:0;width:1568px;height:668px;opacity:.55;
 background:repeating-linear-gradient(90deg,rgba(70,140,150,.0) 0px,rgba(70,140,150,.18) 18px,rgba(70,140,150,0) 36px,rgba(0,0,0,.12) 52px,rgba(70,140,150,0) 66px);
 -webkit-mask:linear-gradient(90deg,#000 0%,#000 55%,rgba(0,0,0,.35) 75%,rgba(0,0,0,.15) 100%)}
.hline{position:absolute;left:0;right:0;top:462px;height:10px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.25));opacity:.8}
.band{position:absolute;left:770px;top:-520px;width:340px;height:1100px;border-radius:0 0 170px 170px;
 background:linear-gradient(180deg,#5b7f62,#557a5e);opacity:.72;transform:rotate(-41deg);transform-origin:50% 100%;left:1065px;top:-745px}
.tri{position:absolute;left:1145px;top:0;width:0;height:0;border-top:430px solid rgba(64,128,140,.55);border-left:430px solid transparent;border-right:0}
.tri2{position:absolute;left:1145px;top:0;width:423px;height:423px;background:linear-gradient(225deg,rgba(64,128,140,.5),rgba(64,128,140,.38));clip-path:polygon(0 0,100% 0,100% 100%,0 0)}
.c1{position:absolute;left:1460px;top:138px;width:230px;height:230px;border-radius:50%;background:#4c8f98;opacity:.85}
.c2{position:absolute;left:1305px;top:422px;width:360px;height:360px;border-radius:50%;background:#2a5683;opacity:.75}
.logo{position:absolute;left:10px;top:13px;font-weight:700;font-size:11px;letter-spacing:.1px}
.out{position:absolute;right:14px;top:21px;width:22px;height:22px}
.grid{position:absolute;left:641px;top:90px;display:grid;grid-template-columns:repeat(3,84px);column-gap:17px;row-gap:8px}
.tile{display:flex;flex-direction:column;align-items:center;width:84px}
.ring{width:84px;height:84px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center}
.ring svg{width:58px;height:58px}
.lbl{margin-top:7px;font-size:11px;font-weight:600;letter-spacing:.2px;line-height:14px}
.dis{opacity:.35}
footer{position:absolute;left:0;right:0;bottom:0;height:20px;background:rgba(3,22,38,.82);border-top:1px solid rgba(255,255,255,.08);
 font-size:10px;line-height:19px;padding-left:12px;color:#c9d6e0}
</style></head><body>
