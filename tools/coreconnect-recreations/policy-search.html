*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1548px;height:668px;overflow:hidden}
body{font-family:-apple-system,"Segoe UI",Roboto,"Open Sans",Helvetica,Arial,sans-serif;background:#f1f1f1;color:#222;font-size:12px}
.bar{height:25px;background:#18324b;display:flex;align-items:center;color:#fff;position:relative}
.logo{font-weight:700;font-size:8px;margin-left:13px;width:75px;letter-spacing:.1px}
.nav{display:flex;gap:0}
.nav svg{display:block}
.nav span{width:38px;display:flex;justify-content:center}
.right{position:absolute;right:0;top:0;height:25px;display:flex;align-items:center}
.pill{width:4px;height:18px;background:#fff;border-radius:2px;margin-right:8px}
.asst{background:#fff;color:#18324b;font-weight:700;font-size:8.5px;border-radius:3px;width:63px;height:18px;display:flex;align-items:center;justify-content:center;margin:0 18px 0 8px}
.crumb{height:32px;background:#f7f7f7;display:flex;align-items:center;padding-left:12px;font-size:12px;color:#222}
.crumb a{color:#3c6a93;text-decoration:underline}
.crumb .sep{margin:0 6px;color:#777}
.crumb u{color:#222}
.search{display:flex;align-items:center;margin:11px 0 0 44px;gap:3px}
.search .inp{width:135px;height:27px;border:1px solid #c9c9c9;background:#f2f2f2;border-radius:3px;font-size:12.5px;padding:6px 4px}
.btn{height:28px;background:#3d6a96;color:#fff;border-radius:14px;display:flex;align-items:center;padding:0 11px 0 9px;font-size:12px;font-weight:600;gap:4px}
h2{font-weight:400;font-size:14.5px;margin:25px 0 0 12px;color:#222}
.show{display:flex;align-items:center;margin:15px 0 0 19px;font-size:12px;gap:3px}
.sel{width:47px;height:24px;border:1px solid #bbb;border-radius:3px;background:#f6f6f6;padding:4px 6px;position:relative;font-size:12px}
.sel:after{content:"";position:absolute;right:6px;top:10px;border:3px solid transparent;border-top:3px solid #333}
table{border-collapse:separate;border-spacing:0 4px;margin:24px 0 0 12px;width:1548px;table-layout:fixed;font-size:12px}
th{text-align:left;font-weight:400;padding:0 0 4px 7px;height:26px;position:relative;color:#222}
th i{position:absolute;right:8px;top:4px;width:6px;height:12px}
th i:before,th i:after{content:"";position:absolute;left:0;border:3px solid transparent}
th i:before{top:0;border-bottom:4px solid #9a9a9a}
th i:after{top:7px;border-top:4px solid #9a9a9a}
th.on i:before{border-bottom-color:#222}
td{background:#dcdfe2;height:30px;padding:0 0 0 7px;color:#222;white-space:nowrap}
td:first-child{background:#bdbfc1;border-radius:7px 0 0 7px;padding-left:14px}
td:last-child{border-radius:0 0 0 0}
td svg{vertical-align:middle;display:block}
td a{color:#3c6a93;text-decoration:underline}
td a b{font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;margin:17px 0 0 12px;font-size:12px}
.pages{display:flex;gap:0;font-size:12px;color:#3c6a93;font-weight:600}
.pages span{padding:0 0 0 0}
.pages .dis{color:#b4bcc6;font-weight:400}
